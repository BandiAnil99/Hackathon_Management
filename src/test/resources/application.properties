spring.datasource.url=jdbc:h2:mem:hackathon;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.schema-updater.enabled=false
jwt.secret=test-secret-that-is-long-enough-for-jwt-signing-1234567890
jwt.expiration-ms=86400000
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000
app.base-qr-url=http://localhost:8080
app.api-cors-url=http://localhost:8080
app.cors.allowed-origins=http://localhost:3000
app.upload-dir=target/test-uploads
app.admin.seed-enabled=false
app.ai.batch-processing-enabled=false
spring.mail.host=localhost
spring.mail.port=2525
logging.level.com.hackathon=WARN
