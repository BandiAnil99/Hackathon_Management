spring.application.name=ai-recruitment-event-platform
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
app.schema-updater.enabled=${SCHEMA_UPDATER_ENABLED:true}

# Uploads
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Authentication
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Public application URLs
app.base-url=${APP_BASE_URL}
app.frontend-url=${APP_FRONTEND_URL}
app.base-qr-url=${APP_QR_URL_BASE}
app.api-cors-url=${APP_BASE_URL}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${APP_FRONTEND_URL}}

# AI resume analysis
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.ai.batch-size=${APP_AI_BATCH_SIZE:5}
app.ai.batch-interval-ms=${APP_AI_BATCH_INTERVAL_MS:30000}
app.ai.batch-processing-enabled=${APP_AI_BATCH_PROCESSING_ENABLED:true}
app.ai.max-retries=${APP_AI_MAX_RETRIES:3}
app.ai.retry-backoff-multiplier=${APP_AI_RETRY_BACKOFF_MULTIPLIER:2}
app.ai.retry-delay-seconds=${APP_AI_RETRY_DELAY_SECONDS:60}

# Email
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
# Gmail requires the STARTTLS upgrade on port 587.  Requiring it prevents a
# connection from silently continuing without TLS when a proxy misbehaves.
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST:}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITETIMEOUT:5000}
spring.mail.properties.mail.debug=${SMTP_DEBUG:false}
app.mail.from=${SMTP_FROM:}

# Optional first administrator. Leave disabled unless all three values are set.
app.admin.seed-enabled=${ADMIN_SEED_ENABLED:false}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

logging.level.com.hackathon.service.ParticipantAiAnalysisService=${AI_ANALYSIS_LOG_LEVEL:INFO}
logging.level.com.hackathon.service.ParticipantAiBatchProcessingService=${AI_BATCH_LOG_LEVEL:INFO}
logging.level.com.hackathon=${APP_LOG_LEVEL:INFO}
